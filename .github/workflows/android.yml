name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NightVisionThermal.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NightVisionThermal-debug-apk
          path: NightVisionThermal.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.8
          name: Night Vision Thermal v1.8
          files: NightVisionThermal.apk
